[package]
name = "scribe"
version = "0.1.0"
description = "Scribe desktop meeting coach scaffold"
authors = ["Scribe"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "scribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "=0.17.1"
hound = "3.5.1"
rusqlite = "0.39.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tempfile = "3.27.0"

# macOS-only: the dictation pill is converted to a non-activating NSPanel so
# clicking it never activates Scribe or steals focus from the user's app.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }

[profile.dev]
debug = 1
